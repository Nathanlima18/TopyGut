<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topy'Gut</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="logo">
      <h1>Topy'Gut</h1>
    </div>

    <nav class="menu">
      <a href="#inicio">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#cliente">Área do Cliente</a>
      <a href="#trabalhe">Estamos Contratando</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero-texto">
        <p class="destaque">Qualidade que chega até você</p>

        <h2>Conheça a nova experiência Topy'Gut</h2>

        <p>
          Produtos de qualidade, novidades e um atendimento mais fácil
          para clientes, parceiros e representantes.
        </p>

        <div class="hero-botoes">
          <a href="#produtos" class="botao botao-principal">
            Ver produtos
          </a>

          <a href="#cliente" class="botao botao-secundario">
            Fazer pedido
          </a>
        </div>
      </div>

      <div class="hero-imagem">
        <div class="imagem-placeholder">
          Imagem principal da Topy'Gut
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

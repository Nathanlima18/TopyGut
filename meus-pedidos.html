<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meus Pedidos | Topy'Gut</title>

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/avif"
        href="img/Logo Topy´Gut.avif"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/meus-pedidos.css"
    >
</head>


<body>

    <!-- ==================================================
         CABEÇALHO
    =================================================== -->

    <header class="cabecalho">

        <div class="cabecalho-container">

            <a
                href="index.html"
                class="logo"
                aria-label="Página inicial da Topy'Gut"
            >
                <img
                    src="img/Logo Topy´Gut.avif"
                    alt="Logo Topy'Gut"
                >
            </a>

            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="menu">

                <a href="painel-cliente.html">
                    Painel
                </a>

                <a href="novo-pedido.html">
                    Novo Pedido
                </a>

                <a
                    href="meus-pedidos.html"
                    class="ativo"
                >
                    Meus Pedidos
                </a>

                <a href="minha-conta.html">
                    Minha Conta
                </a>

                <a
                    href="area-cliente.html"
                    class="sair"
                >
                    Sair
                </a>

            </nav>

        </div>

    </header>


    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    =================================================== -->

    <main class="pedidos">

        <div class="pedidos-container">


            <!-- ==================================================
                 CABEÇALHO
            =================================================== -->

            <section class="pedidos-topo">

                <span class="pedidos-tag">
                    ÁREA DO CLIENTE
                </span>

                <h1>
                    Meus Pedidos
                </h1>

                <p>
                    Consulte seus pedidos anteriores e acompanhe
                    o andamento de cada compra realizada com a Topy'Gut.
                </p>

            </section>


            <!-- ==================================================
                 FILTROS
            =================================================== -->

            <section class="filtros-pedidos">

                <button
                    type="button"
                    class="filtro ativo"
                    data-filtro="todos"
                >
                    Todos
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="pendente"
                >
                    Pendentes
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="separado"
                >
                    Pedido separado
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="entregue"
                >
                    Entregues
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="cancelado"
                >
                    Cancelados
                </button>
            </section>

            <!-- ==================================================
                 LISTA DE PEDIDOS
            =================================================== -->

            <section class="lista-pedidos" id="listaPedidos"> </section>

            <!-- ==================================================
                 ESTADO VAZIO
            =================================================== -->

            <div
                class="pedidos-vazio"
                id="pedidosVazio"
            >

                <h2>
                    Nenhum pedido encontrado
                </h2>

                <p>
                    Não existem pedidos com esse status.
                </p>

            </div>

        </div>

    </main>


    <!-- ==================================================
         RODAPÉ
    =================================================== -->

    <footer class="rodape">

        <div class="rodape-container">

            <img
                src="img/Logo Topy´Gut.avif"
                alt="Topy'Gut"
                class="rodape-logo"
            >

            <p>
                © 2026 Topy'Gut. Todos os direitos reservados.
            </p>

        </div>

    </footer>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="js/config.js"></script>
    <script src="js/meus-pedidos.js"></script>

</body>

</html>
